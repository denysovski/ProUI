name: Validate rules

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-rulebooks.mjs --check
      - run: node scripts/build-effects.mjs --check
      - run: node --check scripts/xslop-scan.mjs
