<html><head><meta charset="utf-8">
<style>

  canvas { position: absolute; inset: 0; }

  .k { font-size: 17px; letter-spacing: 0.02em; color: #7C7C84; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 172px; line-height: 0.88; font-weight: 600; letter-spacing: -0.05em; }

  .ids { margin-top: 34px; font-size: 15px; color: #6C6C74; }

    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style></head>
<body>
<div class="t">
  <div class="k">Skill sheet for AI agents</div>
  <h1><span>X</span>Slop</h1>
  <p>A rulebook for building websites that look made by a person, not generated.</p>
  <div class="ids"><b>149 rules</b> · 14 style keywords · inspiration, toolkit and recipes</div>
</div>
<div class="grain"></div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1600, H = 720;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(2); r.setSize(W, H); r.setClearColor(0x08080A, 1);
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0;
document.body.prepend(r.domElement);

// studio environment for reflections: a dark room with three emissive light strips
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0x020203);
const strip = (w, h, color, intensity, pos, rot) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide }));
  m.position.set(...pos); m.rotation.set(...rot); envScene.add(m);
};
strip(2.2, 14, 0xff5a1f, 5.0, [-7, 1, 2], [0, Math.PI / 2.4, 0]);   // warm orange strip, left
strip(1.4, 12, 0x3d6bff, 3.2, [7, 0, -1], [0, -Math.PI / 2.2, 0]);   // cool blue strip, right
strip(10, 2.4, 0xffffff, 2.6, [0, 8, 2], [Math.PI / 2, 0, 0]);       // white softbox above
strip(6, 0.5, 0xffffff, 1.6, [0, -3, 8], [0, 0, 0]);                 // thin front kicker
strip(30, 12, 0x2a2a33, 0.35, [0, 0, -9], [0, 0, 0]);                // dim back wall so the chrome body is not pure black
const pm = new THREE.PMREMGenerator(r);
const env = pm.fromScene(envScene, 0.02).texture;

const scene = new THREE.Scene();
scene.environment = env;
const cam = new THREE.PerspectiveCamera(28, W / H, 0.1, 100);
cam.position.set(0.4, 1.3, 14); cam.lookAt(3.8, 0.3, 0);
cam.setViewOffset(W, H, -380, 0, W, H);

// chrome X
const chrome = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 1, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.25 });
const bar = new RoundedBoxGeometry(5.6, 0.95, 0.95, 16, 0.47);
const X = new THREE.Group();
const a = new THREE.Mesh(bar, chrome); a.rotation.z = Math.PI / 4;
const b = new THREE.Mesh(bar, chrome); b.rotation.z = -Math.PI / 4; b.position.z = 0.04;
X.add(a, b);
X.position.set(3.9, 0.55, 0); X.rotation.set(-0.18, -0.62, 0.06);
scene.add(X);

// "slop": an iridescent purple blob dissolving into particles
const blobGeo = new THREE.IcosahedronGeometry(1, 48); {
  const p = blobGeo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); const n = v.clone().normalize();
    const d = 1 + 0.14 * Math.sin(n.x * 3.4 + 1.2) * Math.cos(n.y * 2.9) + 0.07 * Math.sin(n.z * 5.1 + 0.4);
    p.setXYZ(i, n.x * d, n.y * d, n.z * d); }
  blobGeo.computeVertexNormals();
}
const blob = new THREE.Mesh(blobGeo, new THREE.MeshPhysicalMaterial({ color: 0x6b4dff, metalness: 0.2, roughness: 0.18, clearcoat: 1, iridescence: 1, iridescenceIOR: 1.6, iridescenceThicknessRange: [200, 900], envMapIntensity: 1.1 }));
blob.scale.setScalar(0.6); blob.position.set(7.0, 1.7, -1.4); scene.add(blob);

// particles drifting away from the blob, fading as they go
const N = 1600, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
const c1 = new THREE.Color(0x8a6bff), c2 = new THREE.Color(0x2a2a40);
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
for (let i = 0; i < N; i++) {
  const t = Math.pow(rnd(), 1.6);                       // more particles near the blob
  const dir = new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).normalize();
  const base = new THREE.Vector3(7.0, 1.7, -1.4).add(dir.clone().multiplyScalar(0.65));
  const drift = new THREE.Vector3(-1.9, -1.1, 0.6).multiplyScalar(t * 3.2).add(dir.multiplyScalar(t * 1.2));
  const pp = base.add(drift); pos.set([pp.x, pp.y, pp.z], i * 3);
  const c = c1.clone().lerp(c2, t); col.set([c.r, c.g, c.b], i * 3);
}
const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos, 3)); pg.setAttribute('color', new THREE.BufferAttribute(col, 3));
scene.add(new THREE.Points(pg, new THREE.PointsMaterial({ size: 0.035, vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false })));

// glossy dark floor that reflects the environment and fades into the background
const floorMat = new THREE.MeshPhysicalMaterial({ color: 0x0b0b0e, metalness: 0.6, roughness: 0.32, envMapIntensity: 0.5 });
const floor = new THREE.Mesh(new THREE.CircleGeometry(9, 96), floorMat);
floor.rotation.x = -Math.PI / 2; floor.position.set(4.2, -2.75, 0); scene.add(floor);
// soft shadow blob under the X
const sh = document.createElement('canvas'); sh.width = sh.height = 256; { const g = sh.getContext('2d'); const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128); gr.addColorStop(0, 'rgba(0,0,0,0.85)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); }
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(6.5, 3.2), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sh), transparent: true, depthWrite: false }));
shadow.rotation.x = -Math.PI / 2; shadow.position.set(3.9, -2.73, 0.2); scene.add(shadow);
// vignette ring to blend the floor edge into the page
scene.fog = new THREE.Fog(0x08080A, 14, 26);

// rim lights to sculpt the silhouette
const rimL = new THREE.DirectionalLight(0xff6a2a, 2.2); rimL.position.set(-6, 2, -4); scene.add(rimL);
const rimR = new THREE.DirectionalLight(0x4a7bff, 1.6); rimR.position.set(8, 3, -3); scene.add(rimR);

const comp = new EffectComposer(r);
comp.addPass(new RenderPass(scene, cam));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.38, 0.55, 0.86));
comp.addPass(new OutputPass());
comp.render();
window.__done = true;
</script>
