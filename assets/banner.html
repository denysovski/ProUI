<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1600px; height: 720px; overflow: hidden; background: #F3EFE6; font-family: 'Inter Display', 'Inter', sans-serif; }
  canvas { position: absolute; inset: 0; }
  .t { position: absolute; left: 96px; top: 50%; transform: translateY(-50%); color: #1E1B16; z-index: 2; }
  .k { font-size: 18px; letter-spacing: 0.02em; color: #8A8173; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 168px; line-height: 0.9; font-weight: 600; letter-spacing: -0.045em; }
  h1 span { color: #D97757; }
  p { margin: 28px 0 0; font-size: 26px; line-height: 1.35; max-width: 520px; color: #4A443A; font-weight: 400; }
  .ids { margin-top: 34px; display: flex; gap: 10px; font-size: 15px; color: #6E665A; }
  .ids b { font-weight: 500; color: #1E1B16; }
</style></head>
<body>
<div class="t">
  <div class="k">Skill sheet for AI agents</div>
  <h1><span>X</span>Slop</h1>
  <p>A rulebook for building websites that look made by a person, not generated.</p>
  <div class="ids"><b>149 rules</b> across slop, craft, motion, states, SEO and performance</div>
</div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = 1600, H = 720;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(2); r.setSize(W, H); r.setClearColor(0xF3EFE6, 1);
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.92;
document.body.appendChild(r.domElement);

const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(r);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;

const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
cam.position.set(0.6, 2.2, 13); cam.lookAt(3.4, 0.2, 0);
cam.setViewOffset(W, H, -360, 0, W, H);   // push the subject to the right half

// the X: two rounded bars in Claude-like terracotta clay
const clay = new THREE.MeshPhysicalMaterial({ color: 0xC4553A, roughness: 0.42, clearcoat: 0.6, clearcoatRoughness: 0.25, sheen: 0.4, sheenColor: 0xffd2bd });
const bar = new RoundedBoxGeometry(5.4, 1.05, 1.05, 8, 0.5);
const X = new THREE.Group();
const a = new THREE.Mesh(bar, clay); a.rotation.z = Math.PI / 4;
const b = new THREE.Mesh(bar, clay); b.rotation.z = -Math.PI / 4; b.position.z = 0.02;
for (const m of [a, b]) { m.castShadow = true; m.receiveShadow = true; X.add(m); }
X.position.set(3.6, 0.55, 0); X.rotation.set(-0.12, -0.55, 0.05);
scene.add(X);

// "slop": glossy lavender / purple-gradient blobs knocked away from the X
const blobGeo = (seed, s) => {
  const g = new THREE.IcosahedronGeometry(s, 24); const p = g.attributes.position; const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); const n = v.clone().normalize();
    const d = 1 + 0.16 * Math.sin(n.x * 3.1 + seed) * Math.cos(n.y * 2.7 + seed * 1.7) + 0.08 * Math.sin(n.z * 4.3 + seed * 2.3);
    v.copy(n.multiplyScalar(s * d)); p.setXYZ(i, v.x, v.y, v.z); }
  g.computeVertexNormals(); return g;
};
const slop = [
  [6.9, 2.3, -0.8, 0.62, 0x9B8CFF, 1.1],
  [7.3, -0.7, 0.6, 0.42, 0x7C8CFF, 2.4],
  [0.2, 2.4, -1.4, 0.48, 0xB49CFF, 3.7],
  [0.6, -1.6, 0.9, 0.34, 0x8F7BFF, 5.2],
  [6.2, -2.2, -1.2, 0.28, 0xA79BFF, 6.6],
  [8.3, 1.1, -2.2, 0.22, 0x8898FF, 7.9],
];
for (const [x, y, z, s, c, seed] of slop) {
  const m = new THREE.Mesh(blobGeo(seed, s), new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.15, transmission: 0.0, clearcoat: 1, iridescence: 0.6, iridescenceIOR: 1.3 }));
  m.position.set(x, y, z); m.rotation.set(seed, seed * 0.5, 0); m.castShadow = true; scene.add(m);
}
// tiny clay crumbs for energy
for (const [x, y, z, sz] of [[1.6, 0.6, 1.2, 0.12], [2.0, -2.0, 1.4, 0.09], [5.6, -2.6, 1.0, 0.1], [6.3, -1.4, 1.6, 0.07], [3.6, 3.9, -0.6, 0.11], [0.9, -0.4, 0.4, 0.06], [2.6, -2.8, 0.2, 0.08]]) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(sz, 24, 16), clay); m.position.set(x, y, z); scene.add(m);
}
// floor that only receives a soft shadow
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.11 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -3.4; floor.receiveShadow = true; scene.add(floor);

const key = new THREE.DirectionalLight(0xfff4ea, 2.4); key.position.set(-4, 10, 7); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03; key.shadow.radius = 12; key.shadow.blurSamples = 20;
Object.assign(key.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14 });
scene.add(key);
scene.add(new THREE.HemisphereLight(0xffffff, 0xe8d8c8, 0.6));
const rim = new THREE.DirectionalLight(0xffc6a8, 1.2); rim.position.set(8, 2, -6); scene.add(rim);

r.render(scene, cam);
window.__done = true;
</script>
</body></html>
